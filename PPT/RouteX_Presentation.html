<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>RouteX — Analysis of Route Planning Algorithms (Presentation)</title>
  <style>
    :root {
      --bg: #070b19;
      --card-bg: rgba(15, 23, 42, 0.95);
      --border: rgba(51, 65, 85, 0.7);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --cyan: #06b6d4;
      --emerald: #10b981;
      --blue: #3b82f6;
      --amber: #f59e0b;
      --pink: #ec4899;
      --purple: #8b5cf6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top Status Bar */
    .top-bar {
      height: 48px;
      background: rgba(15, 23, 42, 0.9);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      z-index: 10;
    }

    .top-left {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      color: #ffffff;
    }

    .top-left span.badge {
      font-size: 10px;
      background: rgba(6, 182, 212, 0.15);
      border: 1px solid rgba(6, 182, 212, 0.3);
      color: var(--cyan);
      padding: 2px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .top-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn {
      background: #1e293b;
      color: #e2e8f0;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .btn:hover {
      background: #334155;
      color: #ffffff;
      border-color: var(--cyan);
    }

    .btn.active {
      background: rgba(6, 182, 212, 0.2);
      border-color: var(--cyan);
      color: var(--cyan);
    }

    /* Slide Stage Container */
    .slide-stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
    }

    .slide-container {
      width: 1080px;
      height: 620px;
      max-width: 95vw;
      max-height: 85vh;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px 50px;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
      animation: slideIn 0.25s ease-out;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: scale(0.98); }
      to { opacity: 1; transform: scale(1); }
    }

    /* Slide Content Elements */
    .slide-header {
      border-bottom: 1px solid rgba(51, 65, 85, 0.6);
      padding-bottom: 14px;
      margin-bottom: 20px;
    }

    .slide-tag {
      font-size: 11px;
      font-weight: 700;
      color: var(--cyan);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 4px;
    }

    .slide-title {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #ffffff;
    }

    .slide-body {
      flex: 1;
      font-size: 15px;
      line-height: 1.6;
      color: #cbd5e1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .slide-body p {
      margin-bottom: 12px;
    }

    .slide-body ul {
      margin-left: 24px;
      margin-bottom: 12px;
    }

    .slide-body li {
      margin-bottom: 8px;
    }

    /* Grid Layout for Slides */
    .grid-2col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      height: 100%;
    }

    .info-card {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 20px;
    }

    .info-card h4 {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Tables */
    table.slide-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      margin: 10px 0;
    }

    table.slide-table th, table.slide-table td {
      border: 1px solid var(--border);
      padding: 8px 12px;
      text-align: left;
    }

    table.slide-table th {
      background: #11192e;
      color: #ffffff;
      font-weight: 700;
    }

    /* Speaker Notes Drawer */
    #speaker-notes-panel {
      position: absolute;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%);
      width: 900px;
      max-width: 90vw;
      background: rgba(15, 23, 42, 0.98);
      border: 1px solid var(--cyan);
      border-radius: 12px;
      padding: 16px 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.9);
      font-size: 13px;
      color: #e2e8f0;
      display: none;
      z-index: 50;
      line-height: 1.5;
    }

    #speaker-notes-panel strong {
      color: var(--cyan);
      display: block;
      margin-bottom: 4px;
    }

    /* Slide Footer */
    .slide-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--text-muted);
      border-top: 1px solid rgba(51, 65, 85, 0.5);
      padding-top: 14px;
      margin-top: 20px;
    }

    /* Bottom Control Bar */
    .bottom-bar {
      height: 52px;
      background: rgba(15, 23, 42, 0.95);
      border-top: 1px solid var(--border);
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
    }

    .nav-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* Print Styles */
    @media print {
      body {
        background: #ffffff !important;
        overflow: visible !important;
      }
      .top-bar, .bottom-bar, #speaker-notes-panel {
        display: none !important;
      }
      .slide-stage {
        padding: 0 !important;
      }
      .slide-container {
        border: none !important;
        box-shadow: none !important;
        page-break-after: always !important;
        width: 100% !important;
        height: 100vh !important;
        color: #000000 !important;
        background: #ffffff !important;
      }
      .slide-title { color: #000000 !important; }
      .slide-body { color: #333333 !important; }
      table.slide-table th { background: #f1f5f9 !important; color: #000 !important; }
      @page {
        size: landscape;
        margin: 1cm;
      }
    }
  </style>
</head>

    let currentSlide = 0;
    let isNotesOpen = false;

    function renderSlide() {
      const slide = slidesData[currentSlide];
      const box = document.getElementById("slide-box");
      box.innerHTML = `
        <div>
          <div class="slide-header">
            <div class="slide-tag">${slide.tag}</div>
            <h2 class="slide-title">${slide.title}</h2>
          </div>
          <div class="slide-body">
            ${slide.body}
          </div>
        </div>
        <div class="slide-footer">
          <span>RouteX: Analysis of Algorithms (AOA)</span>
          <span>Slide ${currentSlide + 1} of ${slidesData.length}</span>
        </div>
      `;

      document.getElementById("slide-counter").textContent = `${currentSlide + 1} / ${slidesData.length}`;
      document.getElementById("notes-content").textContent = slide.notes;
      document.getElementById("slide-jump").value = currentSlide;
    }

    function nextSlide() {
      if (currentSlide < slidesData.length - 1) {
        currentSlide++;
        renderSlide();
      }
    }

    function prevSlide() {
      if (currentSlide > 0) {
        currentSlide--;
        renderSlide();
      }
    }

    function jumpToSlide(idx) {
      if (idx >= 0 && idx < slidesData.length) {
        currentSlide = idx;
        renderSlide();
      }
    }

    function toggleSpeakerNotes() {
      isNotesOpen = !isNotesOpen;
      const panel = document.getElementById("speaker-notes-panel");
      const btn = document.getElementById("notes-btn");
      panel.style.display = isNotesOpen ? "block" : "none";
      if (isNotesOpen) {
        btn.classList.add("active");
      } else {
        btn.classList.remove("active");
      }
    }

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {});
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    // Keyboard Navigation
    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") {
        nextSlide();
      } else if (e.key === "ArrowLeft" || e.key === "PageUp") {
        prevSlide();
      } else if (e.key === "n" || e.key === "N") {
        toggleSpeakerNotes();
      } else if (e.key === "f" || e.key === "F") {
        toggleFullScreen();
      } else if (e.key === "p" || e.key === "P") {
        window.print();
      }
    });

    // Populate Slide Jump Select Menu
    const selectEl = document.getElementById("slide-jump");
    slidesData.forEach((s, idx) => {
      const opt = document.createElement("option");
      opt.value = idx;
      opt.textContent = `${idx + 1}. ${s.title.substring(0, 32)}...`;
      selectEl.appendChild(opt);
    });

    renderSlide();
  </script>
